# cargo-deny config - license, advisory, banned-crate, and source policy.
# Run: `cargo deny check` (all sections) or e.g. `cargo deny check licenses`.

[graph]
# Match what CI actually builds.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Only fail on an UNMAINTAINED advisory for a crate WE own; a transitive going
# unmaintained is not actionable for us and should not block the build.
unmaintained = "workspace"
# Kept in sync with `.cargo/audit.toml`. Add entries WITH a justification and a
# revisit condition - never blanket-ignore.
ignore = []

[licenses]
# SPDX IDs from https://spdx.org/licenses/. Permissive only.
#
# NOTE: there is no copyleft in this list, and that is load-bearing. orbistoun is
# MIT OR Apache-2.0, so a GPL dependency would relicense the binary.
#
# Emulator projects often choose GPL specifically to prevent closed forks. That was
# considered and declined - preventing closed forks is not a goal here - so the
# permissive-only allow-list is a settled decision, not a default awaiting review.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    # MPL-2.0 is **file-level** copyleft, not binary-level. It obliges publishing
    # modifications to MPL-covered *files*; it does not reach our code or relicense
    # the binary, which is what D003 actually guards against. Reached via
    # directories -> dirs-sys -> option-ext, which we consume unmodified.
    #
    # This is a narrower allowance than it looks: GPL and AGPL remain excluded, and
    # the distinction is the point rather than an oversight.
    "MPL-2.0",
    # BSL-1.0 is the Boost licence: permissive, and on the more permissive end of this
    # list rather than the edge of it - it does not even require attribution in a binary
    # distribution. Its absence was an omission rather than a decision. Reached twice via
    # eframe -> arboard -> clipboard-win, and via error-code.
    "BSL-1.0",
]
confidence-threshold = 0.93

# Font licences on a crate that ships fonts, not code.
#
# `epaint_default_fonts` is `(MIT OR Apache-2.0) AND OFL-1.1 AND LicenseRef-UFL-1.0`: the
# code is dual-licensed as usual and the *typefaces* carry their own terms. OFL-1.1 and the
# Ubuntu Font Licence permit embedding and redistribution; what they restrict is selling
# the fonts on their own and reusing reserved font names, neither of which this project
# does or could accidentally do.
#
# Scoped to the one crate rather than added to `allow`, because the reasoning is about
# fonts and would not transfer to a code dependency arriving under the same identifier.
# A blanket allowance would silently cover that case too (D208).
[[licenses.exceptions]]
name = "epaint_default_fonts"
allow = ["OFL-1.1", "LicenseRef-UFL-1.0"]

# A data licence on a crate that ships data, not code.
#
# `webpki-roots` is the Mozilla CA root certificate store packaged for Rust, and
# CDLA-Permissive-2.0 is the Community Data License Agreement - written for datasets
# rather than for software. Version 2.0 is at the permissive end: no copyleft, no
# share-alike on derived data, and unlike 1.0 it does not even require passing the
# notice along. It cannot relicense the binary, which is what D003 actually guards.
#
# Reached via `orbistoun-llm` -> reqwest -> hyper-rustls. The alternative was the
# platform trust store (`rustls-tls-native-roots`), which trades this entry for TLS
# behaviour that varies with whatever the host's certificate store happens to hold -
# a worse trade for a tool whose job here is fetching from one known host.
#
# Scoped to the one crate rather than added to `allow`, for the same reason as the
# fonts above: the reasoning is about a certificate bundle and would not transfer to a
# code dependency arriving under the same identifier. A blanket allowance would cover
# that case silently (D208).
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[bans]
# Duplicate transitive versions are common and usually harmless - warn so we
# notice bloat without failing the build.
multiple-versions = "warn"
# Internal path deps have no `version =` and cargo-deny treats them as
# wildcards; opt them out so the real crates.io wildcard check still fires.
wildcards = "deny"
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
