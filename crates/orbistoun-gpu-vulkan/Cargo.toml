[package]
publish = false
name = "orbistoun-gpu-vulkan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Vulkan implementation of the render backend. The only crate that names a graphics API."

[lints]
workspace = true

[dependencies]
orbistoun-gpu = { workspace = true }
ash = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Removing a float-controls declaration a device cannot honour.
orbistoun-spirv = { workspace = true }
# Which host GPU runs the guest's work, `ORBISTOUN_GPU` (D828).
orbistoun-env = { workspace = true }
# A batch's draw words, written into the mapped draw-data buffer as bytes (D718).
zerocopy = { workspace = true }
# The guest's readable runs, mapped into the device for a device-addressed dispatch (D964).
orbistoun-mem = { workspace = true }

[dev-dependencies]
# Only for the end-to-end test: a module that reached a device by way of a command
# stream, rather than by being handed to the translator directly.
orbistoun-translate = { workspace = true }
# The decoder, so a test can translate guest instruction words end to end.
orbistoun-shader = { workspace = true }
