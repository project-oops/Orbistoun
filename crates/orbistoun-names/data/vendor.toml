# Candidate name vocabulary and shapes.
#
# Nothing here is authoritative. It is a starting point for a brute-force search, and a
# match is what makes any entry real - the hash agrees or it does not, so nothing in
# this file can be wrong in a way that produces a false name.
#
# Provenance: the module names below were read from the *library names* the containers
# themselves declare in their own dynamic tables, which orbistoun already prints. The
# verbs and objects are ordinary English. Nothing was taken from a disassembly or from
# another project's source.
#
# Extending this file is the method. A miss proves only "not in what was tried", so the
# way to name more imports is to add words - and because it is data, that costs no
# rebuild (principle 5).

