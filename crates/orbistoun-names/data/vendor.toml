# An empty part, for shapes that omit a position.
none = [""]


# A verb before its object: the common shape.
[[pattern]]
name = "prefix-module-verb-object"
parts = ["prefix", "module", "verb", "object", "tail"]

# An object before its verb, which some families use instead.
[[pattern]]
name = "prefix-module-object-verb"
parts = ["prefix", "module", "object", "verb", "tail"]

# No module at all, for calls that sit directly under the prefix.
[[pattern]]
name = "prefix-verb-object"
parts = ["prefix", "none", "verb", "object", "tail"]

# Two nouns, which the longer names use - "GetDirectMemorySize", and so on. This is
# where most of the search space is: it multiplies the object list by itself.
[[pattern]]
name = "prefix-module-verb-object-object"
parts = ["prefix", "module", "verb", "object", "object", "tail"]

# A verb between two nouns, for names that read as an action on a member.
[[pattern]]
name = "prefix-module-object-verb-object"
parts = ["prefix", "module", "object", "verb", "object", "tail"]

# A published name, whole, wearing the vendor prefix. The `posix` vocabulary is derived
# from the harvested standard list rather than written here - see `posix_vocabulary`.
#
# This shape was the gap that kept `scePthreadMutexattrSettype` and its neighbours out of
# reach: no combination of module, verb and object spells `Mutexattr`, because the vendor
# did not compose that name, it inherited it (D189).
[[pattern]]
name = "prefix-posix"
parts = ["prefix", "posix", "tail"]

# The two shapes that use words read out of guest modules. Each takes `learned` once, so
# adding a word costs modules x verbs candidates rather than squaring the object list -
# which is why these words are kept out of `object` (D195).
[[pattern]]
name = "prefix-module-verb-learned"
parts = ["prefix", "module", "verb", "learned", "tail"]

[[pattern]]
name = "prefix-module-learned-verb"
parts = ["prefix", "module", "learned", "verb", "tail"]

# A published name behind a module, which `prefix-posix` could not reach.
#
# The vocabulary was never missing: `posix` already holds every harvested standard name,
# capitalised, injected from `standard.txt`. What was missing was a *shape* putting one
# behind a module - so `sceUsleep` was reachable and `sceKernelUsleep` was not, and the
# vendor writes the second. Two of the conformance probe's unnamed imports fall to this
# pattern with nothing added to any word list (D258).
#
# Cheap: it takes `posix` once, so it costs modules x published names rather than squaring
# anything - the same restraint as the `learned` shapes (D195).
[[pattern]]
name = "prefix-module-posix"
parts = ["prefix", "module", "posix", "tail"]

# Two verbs before the object, for names that describe a compound action on one thing -
# `sceKernelLoadStartModule` loads *and* starts. No existing shape allows a second verb,
# so every name of this form was out of reach however complete the vocabulary was (D258).
[[pattern]]
name = "prefix-module-verb-verb-object"
parts = ["prefix", "module", "verb", "verb", "object", "tail"]
# Three shapes measured rather than guessed. `tests/shapes.rs` decomposes the names this
# project found *without* the grammar - read out of module strings, or seen in a trace, so
# owing nothing to the pattern list - and asks which the pattern list can spell. Of 183
# such vendor names only 28 were reachable; 121 needed a shape that did not exist. These
# three are the cheapest of them and spell fourteen today (D261).
#
# **None of them takes `tail`, and that is the whole reason they are affordable.** `tail`
# holds the empty string, so a shape with it is a strict superset of the same shape without
# - adding it would spell suffixed variants as well, at fifteen times the candidates. With
# `tail` these three cost about +225% on the whole space; without it, +15%. The names that
# prompted them carry no suffix, so the cheap version is the one the evidence asks for.

# A call directly under the prefix with no module: `sceRudpBind`, `sceRudpEnd`. Free -
# a hundred and ninety thousand candidates against a space of nearly four billion.
[[pattern]]
name = "prefix-learned-verb"
parts = ["prefix", "learned", "verb"]

# Two nouns naming one subsystem before the verb: `sceAudioPropagationRoomCreate` is
# propagation, then room, then create.
#
# **This is the shape D195 ruled out, and the ruling is no longer binding.** It keeps
# `learned` to one position per pattern because these enumerations are the product of
# their parts and squaring a large list is unaffordable. At the 12,255 entries `learned`
# held this morning it would have been twelve trillion candidates. At 177 it is a hundred
# and sixty-nine million - four thousand eight hundred times cheaper, because the list was
# reduced for unrelated reasons (D262).
[[pattern]]
name = "prefix-module-learned-learned-verb"
parts = ["prefix", "module", "learned", "learned", "verb"]
disabled = """
Costs the vocabulary 33x what it earns. `learned` appears twice here, so a vocabulary round
is quadratic in it: at a 2.6-billion-candidate budget the two learned-squared shapes cap the
list at 483 words, and without them it would hold 16,042.

Measured against the corpus, that is the wrong trade by an order of magnitude. Of 8,417
vendor-shaped names found without the grammar, 1,025 are blocked on a missing *shape* and
6,966 cannot be split into known *words* at all - so vocabulary is roughly seven times the
constraint shapes are, and these two shapes are what caps it.

D262 shrank the vocabulary to make these affordable and that was sound given the shapes; what
nobody asked was whether the shapes were worth the shrink. They forecast about 145 names
between them and have produced 2 of the 323 generated records in the database.

Re-enable when the vocabulary is large enough that these stop being the binding constraint,
or if a curated list makes the forecast land. The shape is not wrong - it is early (D342).
"""

# A third shape - `prefix-learned-verb-learned-learned`, for `sceFontGetHorizontalLayout` -
# was added here and removed the same day. It is the largest group `tests/shapes.rs` finds,
# and it cost **67% of every vocabulary round** while finding nothing.
#
# The mistake was costing it the wrong way. A shape's share of the *whole* search space is
# what a full sweep pays, and by that measure it was cheap: +11%. A vocabulary round pays
# something else entirely - it re-sweeps every pattern using the grown slot, at full size -
# and `learned` three times over is 406 million candidates against a round total of 606
# million. Two different costs, and the one that matters depends on which search is running
# (D264).

# A verb over two learned nouns: `sceKernelReserveVirtualRange` is reserve, then virtual,
# then range. The mirror of `prefix-module-learned-learned-verb` above, which puts the two
# nouns *before* the verb - both orders occur and only one was spelled.
#
# **The name that prompted this is the one that opened a wall**, and every word it needs was
# already here: `Reserve` a verb, `Kernel` a module, `Virtual` and `Range` both learned. Only
# the shape was missing, which is why it had to arrive from the string harvester instead
# (D283, D285).
#
# Second of every shape `tests/shapes.rs` finds the corpus wanting: **105 names for +99%**,
# roughly doubling the sweep. The one above it unlocks forty more at twenty-five thousand
# times the whole space, which is the line between a shape worth adding and a shape saying
# the name has to come from somewhere other than the generator.
#
# No `tail`, for the reason D261 gives: `tail` holds the empty string, so carrying it makes
# this a strict superset of itself at about fifteen times the candidates, and the names that
# prompted it carry no suffix.
[[pattern]]
name = "prefix-module-verb-learned-learned"
parts = ["prefix", "module", "verb", "learned", "learned"]
disabled = """
Costs the vocabulary 33x what it earns. `learned` appears twice here, so a vocabulary round
is quadratic in it: at a 2.6-billion-candidate budget the two learned-squared shapes cap the
list at 483 words, and without them it would hold 16,042.

Measured against the corpus, that is the wrong trade by an order of magnitude. Of 8,417
vendor-shaped names found without the grammar, 1,025 are blocked on a missing *shape* and
6,966 cannot be split into known *words* at all - so vocabulary is roughly seven times the
constraint shapes are, and these two shapes are what caps it.

D262 shrank the vocabulary to make these affordable and that was sound given the shapes; what
nobody asked was whether the shapes were worth the shrink. They forecast about 145 names
between them and have produced 2 of the 323 generated records in the database.

Re-enable when the vocabulary is large enough that these stop being the binding constraint,
or if a curated list makes the forecast land. The shape is not wrong - it is early (D342).
"""
