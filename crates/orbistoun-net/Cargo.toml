[package]
publish = false
name = "orbistoun-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Networking HLE: sockets over the filesystem shim's, the HTTP client over the host's network, and declarations for the rest."

[lints]
workspace = true

[dependencies]
orbistoun-core = { workspace = true }
# The socket bodies. This crate declares `libSceNet` and knows how it numbers an error;
# `orbistoun-fs` owns the sockets themselves and answers a POSIX errno, which is the one
# thing the two spellings disagree about (D667).
orbistoun-fs = { workspace = true }
orbistoun-hle = { workspace = true }
# Guest strings, out-parameters and buffers for the HTTP client.
orbistoun-mem = { workspace = true }
# The HTTP client's transfers: blocking, over `rustls` (D727).
reqwest = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The host adapter's netmask, gateway, DNS servers, hardware address and MTU, which
# `sceNetCtlGetInfo` reports.
windows-sys = { workspace = true }

[dev-dependencies]
