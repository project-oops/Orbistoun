[package]
publish = false
name = "orbistoun-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The shared logic layer every shim calls - operations exist exactly once."

[lints]
workspace = true

[dependencies]
orbistoun-elf = { workspace = true }
orbistoun-mem = { workspace = true }
orbistoun-thunk = { workspace = true }
orbistoun-core = { workspace = true }
orbistoun-nid = { workspace = true }
orbistoun-hle = { workspace = true }
orbistoun-shell = { workspace = true }
orbistoun-loader = { workspace = true }
orbistoun-proto = { workspace = true }
orbistoun-report = { workspace = true }
orbistoun-paths = { workspace = true }
orbistoun-probe = { workspace = true }
orbistoun-env = { workspace = true }
sha1 = { workspace = true }
orbistoun-kernel = { workspace = true }
orbistoun-libc = { workspace = true }
orbistoun-posix = { workspace = true }
orbistoun-gpu = { workspace = true }
orbistoun-audio = { workspace = true }
orbistoun-net = { workspace = true }
orbistoun-video = { workspace = true }
orbistoun-input = { workspace = true }
orbistoun-fs = { workspace = true }
orbistoun-systemservice = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The hardware measurement table and the guest calling convention, for the claims in
# `tests/hardware.rs`. Both are already dependencies of the library; an integration test
# sees only the crate and its dev-dependencies, so they are named again here.
orbistoun-hle = { workspace = true }
orbistoun-core = { workspace = true }
# The float environment a guest is entered under, so the measured `MXCSR` can be asserted
# against what orbistoun actually installs rather than against a constant copied twice.
orbistoun-abi = { workspace = true }
