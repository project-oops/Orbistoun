[package]
name = "orbistoun-gen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Offline generators for the shader data tables. Not part of the emulator."
publish = false

[dependencies]
oops-log = { workspace = true }
orbistoun-env = { workspace = true }
# The crate that owns the knowledge format, so the merge rule and the provenance rules are
# the ones `learn` uses rather than a second copy of them here (D291, D292).
orbistoun-hle = { workspace = true }
# The crate that owns the probe's record format, so a `measure` record is read by the
# reader that defines it rather than by a second field-split living one directory away
# (D605).
orbistoun-probe = { workspace = true }
# For the date a derived entry is stamped with, from the same clock `learn` stamps with.
orbistoun-nid = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
regex = { workspace = true }
# Keying a recording by what was asked. Deterministic across platforms and releases, which
# `DefaultHasher` is not - a recording keyed by that replays only where it was taken.
sha1 = { workspace = true }
# Reading the committed encoding table, rather than hand-parsing a file that is
# genuinely TOML into a second dialect for it to disagree with.
toml = { workspace = true }

[lints]
workspace = true
