[package]
publish = false
name = "orbistoun-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Desktop window - library, per-title inspection, and the run diagnostics."

[lints]
workspace = true

[dependencies]
oops-log = { workspace = true }
oops-docs = { workspace = true }
orbistoun-service = { workspace = true }
# The profiling pane's Tracy tools (D831).
orbistoun-perf = { workspace = true }
orbistoun-input = { workspace = true }
orbistoun-shell = { workspace = true }
orbistoun-probe = { workspace = true }
orbistoun-report = { workspace = true }
orbistoun-proto = { workspace = true }
orbistoun-worker = { workspace = true }
orbistoun-env = { workspace = true }
orbistoun-paths = { workspace = true }
# A title's mods, listed and switched on or off (D836).
orbistoun-overrides = { workspace = true }
orbistoun-loader = { workspace = true }
orbistoun-kernel = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
image = { workspace = true }

# A pad port set to a host gamepad reads one through this. Windows only: on Linux it links the
# system's libudev, so there a gamepad port answers a neutral pad and the run says so.
[target.'cfg(windows)'.dependencies]
gilrs = { workspace = true }

[features]
# The Tracy profiler's client, built in and started only when a run asks (D829, D831).
default = ["tracy"]
# The Tracy profiler's zones, in the worker this binary runs (D829).
tracy = ["orbistoun-worker/tracy"]

[dev-dependencies]
# Temp directories for the capture tests, which write a real PNG and read it back.
tempfile = { workspace = true }

# The Windows executable carries the icon Explorer and the taskbar show.
# Gated by target so it is not fetched or built on Linux or macOS, where an
# executable has nowhere to put one. Same arrangement as the CLI crates.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
