[package]
publish = false
name = "orbistoun-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Vendor command-stream translation to Vulkan, and vendor shader translation to SPIR-V."

[lints]
workspace = true

[dependencies]
orbistoun-core = { workspace = true }
orbistoun-hle = { workspace = true }
orbistoun-kernel = { workspace = true }
orbistoun-shader = { workspace = true }
orbistoun-translate = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# The kept translations (D113).
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zerocopy = { workspace = true }
# Whether guest memory was written since a point, asked of the host (commit 8beebaa).
orbistoun-mem = { workspace = true }
# The stack area of the call in progress, for builders with more than six arguments.
orbistoun-thunk = { workspace = true }
# The perf spans as Tracy zones, in a `tracy` build (D829).
tracy-client = { workspace = true, optional = true }

[features]
# Streams the perf phases and spans to the Tracy profiler (D829). Off in every default build.
tracy = ["dep:tracy-client"]

[dev-dependencies]
# Registering a module, to see which NID a declared name links to.
orbistoun-nid = { workspace = true }
tempfile = { workspace = true }
