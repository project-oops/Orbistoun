# ---- Packets that write registers -------------------------------------------
#
# Body word zero is an index relative to `base`; the words after it are values for
# consecutive registers from there.
#
# The base is what makes this risky. Get it wrong and every register in the class is
# misattributed by a constant offset - consistently, which is worse than randomly,
# because the result looks orderly.

[[register_write]]
opcode = 0x69
name = "SET_CONTEXT_REG"
base = 0xA000

[[register_write]]
opcode = 0x76
name = "SET_SH_REG"
base = 0x2C00

[[register_write]]
opcode = 0x79
name = "SET_UCONFIG_REG"
base = 0xC000

# The indexed form. Its offset word carries an index in bits 31:28 (the GL cube capture writes
# VGT_PRIMITIVE_TYPE through it as 0x10000242, index 1), which the decoder masks off.
[[register_write]]
opcode = 0x7A
name = "SET_UCONFIG_REG_INDEX"
base = 0xC000

# ---- Registers holding shader addresses -------------------------------------
#
# A shader address is split across two registers: the low half and the high half. Both
# must be seen before an address can be formed, which is itself a useful check - a lone
# half means the stream was truncated or the mapping is wrong.
#
# `stage` is reported verbatim and nothing dispatches on it.
#
# This list is deliberately short. It covers the two stages that matter first - a
# fragment shader and a compute shader are what a first frame and a first dispatch
# need - and every entry is a hypothesis until checked against a real submission.

# SPI_SHADER_PGM_LO_PS / HI_PS. These were 0x2C0C / 0x2C0D until the GL cube capture
# (tests/captures/agc-gl-cube-fw1240-a) showed those two to be SPI_SHADER_USER_DATA_PS_0 / 1,
# the descriptor-table pointer: the pixel shader the hardware ran sat at the address written
# four registers lower.
[[shader_address]]
register = 0x2C08
stage = "fragment"
half = "low"

[[shader_address]]
register = 0x2C09
stage = "fragment"
half = "high"

# SPI_SHADER_PGM_LO_ES / HI_ES: where the vertex program runs from. These were 0x2C48 / 0x2C49,
# SPI_SHADER_PGM_LO_VS - the legacy vertex stage, which an NGG pipeline does not fetch from. They
# matched only because the open-toolchain SDK's per-frame stage table points VS, GS and ES at the
# same code. On this generation the NGG wave takes its program counter from PGM_LO_ES (Mesa
# `radv_shader.c:2078-2084`, `R_00B320` for GFX10 and 10.3; oops-sdk `gl_draw.c`, measured on the
# console), and a mid-frame program switch rewrites only the GS and ES pairs - so every Neverball
# draw after its switch to three-parameter vertices ran the two-parameter program here (commit 8beebaa).
[[shader_address]]
register = 0x2CC8
stage = "vertex"
half = "low"

[[shader_address]]
register = 0x2CC9
stage = "vertex"
half = "high"

[[shader_address]]
register = 0x2E0C
stage = "compute"
half = "low"

[[shader_address]]
register = 0x2E0D
stage = "compute"
half = "high"
