# Command-processor packet vocabulary.
#
# ## What this is for
#
# `packet::walk` needs none of this - it walks a submission using header structure
# alone. This file is what turns numbers into meaning: which opcode is which, which
# packets write hardware registers, and which registers hold the address of a shader.
#
# That last one is the link between the two halves of the GPU work. A submission does
# not contain shaders; it contains *addresses* of shaders. Following them is what lets
# a captured command stream feed the shader corpus.
#
# ## Status
#
# **Opcode names: transcribed, low risk.** A wrong name is cosmetic - it mislabels a
# report and corrupts nothing, because nothing dispatches on the name.
#
# **Register-setting packets: transcribed, structural risk.** The base offsets decide
# which register a write lands on. A wrong base shifts every register in that class,
# so writes get attributed to the wrong register consistently.
#
# **Shader address registers: transcribed, and the least certain thing here.** Unlike
# the shader encoding table there is no reference disassembler to check these against,
# so they have no differential test and cannot get one cheaply. Treat any shader
# address this file produces as a *candidate* rather than a fact - which is why
# `registers.rs` reports them as candidates and why nothing follows one blindly.
#
# The honest position: the extraction mechanism below is structural and will be
# correct regardless. The interpretation is a hypothesis, and it is stored as data
# precisely so it can be corrected against a real submission without a rebuild.
#
# ## Reference
#
# The packet format and register layout are publicly documented by AMD, and parsed by
# the open-source Linux driver and by Mesa. Hardware documentation from the chip
# vendor, not console firmware. See ACKNOWLEDGEMENTS.

# ---- Type-3 opcodes ---------------------------------------------------------
#
# Names only. Nothing dispatches on these; they exist so a histogram reads as
# "DRAW_INDEX_AUTO x412" instead of "0x2d x412".

# Every name is Mesa's, from `src/amd/common/sid.h` (the `PKT3_*` defines): the open driver for this
# GPU family, published. Where a family defines one value twice the first definition is taken.
# Sony's own sub-operations inside a type-3 NOP are not here; they are unmeasured.

