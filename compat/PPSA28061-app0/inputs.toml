# guest entry; Cross then Options, pressed and released every forty flips from flip 200, so a
# press lands on the notice whatever the host speed. Then into play: Cross at flip 1200 wakes the
# title's menu, and Circle - the menus' confirm - held ten flips every sixty flips from 1260 takes
# START, the difficulty (NORMAL) and the stage intro; stage one is on screen by flip 1800, where
# the later presses fire. Written by hand, not captured.

