<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img"
     aria-label="No capture yet">
  <!-- The stand-in for a screenshot nobody has taken. One file, shared by every title without
       that capture: a page with a gap where an image should be reads as broken, and one that
       drops the row reads as though the question were never asked (orbistoun D660). -->
  <rect width="640" height="360" fill="#14161a"/>
  <rect x="8" y="8" width="624" height="344" fill="none" stroke="#2b303a" stroke-width="2"
        stroke-dasharray="10 8"/>
  <g fill="#5c6675" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="320" y="176" font-size="26" letter-spacing="0.5">no capture yet</text>
    <text x="320" y="208" font-size="14">this title has not produced a frame orbistoun could read</text>
  </g>
</svg>
