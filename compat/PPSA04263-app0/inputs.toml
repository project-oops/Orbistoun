# PPSA04263 with a controller connected from the start, as the console has one: a pad delivered
# with nothing held sets the record's connected flag (D713). South (Cross) is pressed for 150 ms
# every 3 s from 20 s, by the host clock, so a press lands on whatever screen waits on one - the
# title's "Continue", the first-launch language menu - whether or not the screen is still flipping:
# the language menu draws once and waits, and a flip-keyed press after it never fires.
# Written by hand, not captured.

