# PPSA04263 with a controller connected from the start, as the console has one: a pad delivered
# with nothing held sets the record's connected flag (D713). Presses are held three flips and keyed
# to the title's own flips, which it keeps making on every screen to its landing menu, so a slower
# load does not move a press onto the wrong screen. Cross every 40 flips from 400 to 1960 takes the
# title's "Continue" and, on a first launch, the language menu. The landing menu (Online, GTA+,
# Story) is up by about flip 2750 on a first launch and 2000 with a profile saved; Cross on its
# Online tab retries the connection, which R1 then waits on, so nothing is pressed there until R1
# twice moves to Story and Cross picks it. Cross every 40 flips after answers what follows.
# Written by hand, not captured.

